<main class="pagina-cadastro">
  <section class="caixa-cadastro">
    <h1>Criar conta</h1>

    <mat-form-field appearance="outline">
      <mat-label>Nome</mat-label>
      <input
        matInput
        name="nome"
        type="text"
        [(ngModel)]="nome"
        placeholder="Seu nome"
        [errorStateMatcher]="erroNome"
      />
      <mat-error>{{ errosCampos['nome'] }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>E-mail</mat-label>
      <input
        matInput
        name="email"
        type="email"
        [(ngModel)]="email"
        placeholder="seu@email.com"
        [errorStateMatcher]="erroEmail"
      />
      <mat-error>{{ errosCampos['email'] }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Senha</mat-label>
      <input
        matInput
        name="senha"
        [type]="senhaVisivel ? 'text' : 'password'"
        [(ngModel)]="senha"
        placeholder="Sua senha"
        [errorStateMatcher]="erroSenha"
      />
      <button
        mat-icon-button
        matIconSuffix
        type="button"
        [attr.aria-label]="senhaVisivel ? 'Ocultar senha' : 'Mostrar senha'"
        (click)="senhaVisivel = !senhaVisivel"
      >
        <mat-icon>{{ senhaVisivel ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error>{{ errosCampos['senha'] }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Confirmar senha</mat-label>
      <input
        matInput
        name="confirmacaoSenha"
        [type]="confirmacaoSenhaVisivel ? 'text' : 'password'"
        [(ngModel)]="confirmacaoSenha"
        placeholder="Confirme sua senha"
        [errorStateMatcher]="erroConfirmacao"
      />
      <button
        mat-icon-button
        matIconSuffix
        type="button"
        [attr.aria-label]="confirmacaoSenhaVisivel ? 'Ocultar confirmação de senha' : 'Mostrar confirmação de senha'"
        (click)="confirmacaoSenhaVisivel = !confirmacaoSenhaVisivel"
      >
        <mat-icon>{{ confirmacaoSenhaVisivel ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error>{{ errosCampos['confirmacaoSenha'] }}</mat-error>
    </mat-form-field>

    <button
      mat-flat-button
      type="button"
      (click)="cadastrar()"
      [disabled]="cadastroConcluido"
    >
      CADASTRAR
    </button>

    <p>
      Já tem conta?
      <a routerLink="/entrar">Entrar</a>
    </p>
  </section>
</main>
