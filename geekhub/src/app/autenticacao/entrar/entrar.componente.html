<main class="pagina-entrar">
    <mat-card class="caixa-entrar">
        <h1>Entrar</h1>

        <form (ngSubmit)="aoEnviar()" novalidate>
            <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
                <mat-label>E-mail</mat-label>

                <input matInput type="email" name="email" [(ngModel)]="email" (ngModelChange)="limparErroCampo('email')"
                    [attr.aria-invalid]="!!errosCampos.email"
                    [attr.aria-describedby]="errosCampos.email ? 'erro-email' : null" autocomplete="username"
                    placeholder="seu@email.com" />
            </mat-form-field>

            @if (errosCampos.email) {
            <p id="erro-email" class="erro-campo" role="alert">
                {{ errosCampos.email }}
            </p>
            }

            <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
                <mat-label>Senha</mat-label>

                <input matInput name="senha" [type]="senhaVisivel ? 'text' : 'password'" [(ngModel)]="senha"
                    (ngModelChange)="limparErroCampo('senha')" [attr.aria-invalid]="!!errosCampos.senha"
                    [attr.aria-describedby]="errosCampos.senha ? 'erro-senha' : null" autocomplete="current-password"
                    placeholder="sua senha" />

                <button mat-icon-button matSuffix type="button" class="botao-visibilidade"
                    [attr.aria-label]="senhaVisivel ? 'Ocultar senha' : 'Mostrar senha'"
                    [attr.aria-pressed]="senhaVisivel" (click)="alternarVisibilidadeSenha()">
                    <mat-icon fontSet="material-symbols-outlined">
                        {{ senhaVisivel ? 'visibility_off' : 'visibility' }}
                    </mat-icon>
                </button>
            </mat-form-field>

            @if (errosCampos.senha) {
            <p id="erro-senha" class="erro-campo" role="alert">
                {{ errosCampos.senha }}
            </p>
            }

            @if (mensagemErro) {
            <p class="mensagem-erro" role="alert">
                {{ mensagemErro }}
            </p>
            }

            <button mat-flat-button type="submit" class="botao-entrar" [disabled]="enviando">
                {{ enviando ? 'ENTRANDO...' : 'ENTRAR' }}
            </button>
        </form>

        <p class="texto-cadastro">
            Não tem conta?
            <a routerLink="/cadastro">Criar conta</a>
        </p>
    </mat-card>
</main>
