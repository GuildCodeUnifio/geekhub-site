<mat-toolbar class="barra">
  @if (versao === 'Completa') {
    <button matIconButton type="button" aria-label="Abrir menu" [matMenuTriggerFor]="menuPrincipal">
      <mat-icon>menu</mat-icon>
    </button>
  }
  <a class="marca" routerLink="/" aria-label="GeekHub — catálogo">
    <img class="logo" [src]="dados.logoUrl" alt="" />
    <span class="titulo">{{ dados.nomeSistema }}</span>
  </a>
  @if (versao === 'Completa') {
    <span class="espacador"></span>
    <button matIconButton type="button" aria-label="Buscar produtos">
      <mat-icon>search</mat-icon>
    </button>
    <button matIconButton type="button" aria-label="Favoritos indisponíveis" disabled>
      <mat-icon>favorite</mat-icon>
    </button>
    <button matIconButton type="button" aria-label="Mais opções" disabled>
      <mat-icon>more_vert</mat-icon>
    </button>
  }
</mat-toolbar>

<mat-menu #menuPrincipal="matMenu">
  @for (item of itensMenu; track item.caminho) {
    @if (!item.exigeSessao || usuarioAtual) {
      <a mat-menu-item [routerLink]="item.caminho">
        <mat-icon>{{ item.icone }}</mat-icon
        ><span>{{ item.rotulo }}</span>
      </a>
    }
  }
  @if (usuarioAtual) {
    <a mat-menu-item routerLink="/minha-conta/perfil"
      ><mat-icon>person</mat-icon><span>Minha conta</span></a
    >
    <button mat-menu-item type="button" (click)="sair.emit()">
      <mat-icon>logout</mat-icon><span>Sair</span>
    </button>
  } @else {
    <a mat-menu-item routerLink="/autenticacao/entrar"
      ><mat-icon>login</mat-icon><span>Entrar</span></a
    >
    <a mat-menu-item routerLink="/autenticacao/cadastro"
      ><mat-icon>person_add</mat-icon><span>Criar conta</span></a
    >
  }
</mat-menu>
